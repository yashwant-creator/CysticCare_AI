[build]
  publish = "build/web"
  command = """
    # Install Flutter
    git clone https://github.com/flutter/flutter.git -b stable --depth 1
    export PATH="$PATH:`pwd`/flutter/bin"
    
    # Enable web support
    flutter config --enable-web
    
    # Get dependencies
    flutter pub get
    
    # Build for web
    flutter build web --release
  """

[build.environment]
  # Set environment variables for Flutter
  PUB_CACHE = ".pub-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200