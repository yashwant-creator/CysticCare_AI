services:
  backend:
    build: .
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      # Persists the ChromaDB vector index across container restarts
      - chroma_data:/app/app/openai_chroma_data
      # Mount your PDF papers (read-only); vectors are built from these on first run
      - ./app/data/papers:/app/app/data/papers:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  chroma_data:
